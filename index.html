      class="btn btn-top-primary"
      id="cartButton"
      type="button"
    >

      <span
        id="cartCount"
        class="count-badge"
      >0</span>
    </button>

  </div>

<script>document.addEventListener("DOMContentLoaded",()=>{document.querySelector("#catalogButton")?.addEventListener("click",()=>{history.pushState({},"","?catalog=1");renderRoute()});document.querySelector("#headerSearch")?.addEventListener("keydown",e=>{if(e.key==="Enter"){state.query=e.target.value.trim();history.pushState({},"","?catalog=1");renderRoute()}})});</script>
