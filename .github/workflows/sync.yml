name: YECHIM daily Eman sync
on:
  schedule:
    - cron: '0 1 * * *' # Runs at 01:00 UTC = 06:00 Asia/Tashkent (UTC+5)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Sync Eman -> Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync/sync_eman.py
      - name: Commit fallback snapshot
        run: |
          git config user.name 'YECHIM Sync Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/products.json
          git diff --cached --quiet || git commit -m 'Daily Eman catalog snapshot'
          git push
