name: Deploy YECHIM Catalog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
         mkdir -p _site/dashboard
         cp index.html app.js styles.css supabase-config.js _site/
         cp -r dashboard/* _site/dashboard/
         mkdir -p _site/data _site/assets
         cp -r data/* _site/data/ 2>/dev/null || true
         cp -r assets/* _site/assets/ 2>/dev/null || true


      - name: Verify Pages artifact
        run: |
          echo "=== _site root ==="
          ls -la _site
          test -f _site/index.html
          echo "index.html OK"

          echo "=== dashboard ==="
          ls -la _site/dashboard
          test -f _site/dashboard/index.html
          test -f _site/dashboard/app.js

          echo "=== sync timestamp ==="
          ls -la _site/data
          test -f _site/data/last_sync.json
          cat _site/data/last_sync.json
          echo "last_sync.json OK"


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
